[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fska-research"
version = "0.2.0"
description = "Flow-based Spectral Kernel Attention: three experiment suites"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.2", "normflows==1.7.3",
  "numpy>=1.24", "scikit-learn>=1.3", "PyYAML>=6", "matplotlib>=3.7",
  "datasets>=2.19"
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["fska*", "experiments*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

